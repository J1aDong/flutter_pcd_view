group 'io.github.j1adong.flutter_pcd_view'
version '1.0-SNAPSHOT'

import java.util.Properties

buildscript {
    ext.kotlin_version = '1.9.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

final abiTargets = ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']
final localProperties = new Properties()
final exampleLocalPropertiesFile = file('../example/android/local.properties')
if (exampleLocalPropertiesFile.exists()) {
    exampleLocalPropertiesFile.withInputStream { localProperties.load(it) }
}

// 包内已附带预编译的 Rust .so（android/src/main/jniLibs）。调用方无需安装 Rust。
// 仅当预编译产物缺失（即在仓库内开发）时才回退到 cargo ndk 构建。
def hasPrebuiltJniLibs = abiTargets.every { abi ->
    file("src/main/jniLibs/${abi}/libflutter_pcd_view.so").exists()
}

if (!hasPrebuiltJniLibs) {
    def resolveNdkPath = {
        def envPath = System.getenv('ANDROID_NDK_HOME') ?: System.getenv('NDK_HOME')
        if (envPath) return envPath

        def sdkDir = localProperties.getProperty('sdk.dir')
        if (sdkDir) {
            def ndkDir = new File(sdkDir, 'ndk')
            if (ndkDir.isDirectory()) {
                def newest = ndkDir.listFiles()?.sort { it.name }?.last()
                if (newest != null) return newest.absolutePath
            }
        }

        throw new GradleException('Android NDK not found. Set ANDROID_NDK_HOME or NDK_HOME before building flutter_pcd_view.')
    }

    tasks.register('buildRustAndroid', Exec) {
        workingDir '../rust'
        final cargoLockFile = file('../rust/Cargo.lock')

        def buildMode = (project.findProperty('flutter.buildMode') ?: localProperties.getProperty('flutter.buildMode') ?: 'debug').toString()
        def cargoArgs = ['cargo', 'ndk']
        abiTargets.each { cargoArgs += ['-t', it] }
        cargoArgs += ['-o', '../android/src/main/jniLibs', 'build']
        if (buildMode == 'release' || buildMode == 'profile') {
            cargoArgs += ['--release']
        }

        commandLine cargoArgs
        environment 'ANDROID_NDK_HOME', resolveNdkPath()
        environment 'NDK_HOME', resolveNdkPath()

        inputs.files(fileTree('../rust/src'))
        inputs.file('../rust/Cargo.toml')
        if (cargoLockFile.exists()) {
            inputs.file(cargoLockFile)
        }
        outputs.dir('src/main/jniLibs')
    }

    afterEvaluate {
        tasks.matching { it.name == 'preBuild' }.configureEach {
            dependsOn tasks.named('buildRustAndroid')
        }
    }
}

android {
    namespace 'io.github.j1adong.flutter_pcd_view'
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        main.jniLibs.srcDirs = ['src/main/jniLibs']
    }

    defaultConfig {
        minSdk 21
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
}
